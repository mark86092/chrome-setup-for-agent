[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_SCREEN_SIZE)s
user=chrome
priority=10
autorestart=true

[program:fluxbox]
command=bash -c "sleep 1; exec fluxbox"
user=chrome
environment=DISPLAY=":99"
priority=20
autorestart=true

[program:x11vnc]
command=bash -c "sleep 1; exec x11vnc -display :99 -rfbauth /home/chrome/.vncpass -rfbport 5900 -localhost -forever -shared"
user=chrome
priority=30
autorestart=true

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true

; Chrome only binds CDP to 127.0.0.1; socat re-exposes it on 9223.
[program:cdp-proxy]
command=socat TCP-LISTEN:9223,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9222
priority=40
autorestart=true

[program:chrome]
command=bash -c "sleep 2; rm -f /home/chrome/profile/Singleton*; exec google-chrome --no-sandbox --disable-dev-shm-usage --no-first-run --no-default-browser-check --user-data-dir=/home/chrome/profile --remote-debugging-port=9222 --remote-allow-origins=* --window-size=%(ENV_WIDTH)s,%(ENV_HEIGHT)s --window-position=0,0"
user=chrome
environment=DISPLAY=":99",HOME="/home/chrome"
priority=50
autorestart=true
