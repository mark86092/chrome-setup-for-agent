name: chrome-setup-for-agent

services:
  chrome:
    build: .
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?set VNC_PASSWORD in .env}
      WIDTH: "1920"
      HEIGHT: "1080"
      SCREEN_SIZE: "1920x1080x24"
    volumes:
      - ./profile:/home/chrome/profile
